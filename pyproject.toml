[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkingbox-training"
version = "0.1.0"
description = "Executable database-state rewards for multi-turn agent post-training"
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE.TXT",
    "NOTICE",
    "patches/verl/v0.9.0/UPSTREAM_LICENSE",
]
keywords = ["agents", "reinforcement-learning", "grpo", "mcp", "thinkingbox"]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Public ThinkingBox framework.
    "thinkingbox",
    # Validated Qwen3.8 full-parameter training runtime.
    "torch==2.13.0",
    "transformers==5.10.4",
    "accelerate==1.12.0",
    "peft==0.19.1",
    "numpy==2.3.5",
    "safetensors==0.8.0",
    "einops==0.8.2",
    "flash-linear-attention==0.5.2",
    "fla-core==0.5.2",
    "triton==3.7.1",
    "torchdata==0.11.0",
    "TransferQueue==0.1.10",
    "ray==2.58.0",
    "verl==0.9.0",
    "vllm==0.27.1",
    # Dataset and tokenizer support used directly by the trainer.
    "datasets>=3.0",
    "tokenizers>=0.20",
    "sentencepiece",
    # Experiment tracking / utilities
    "tqdm",
    "rich",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Install separately after the base env is built; these wheels are picky.
fast = [
    "flash-attn==2.8.3.post1",
    "causal-conv1d==1.6.2.post1",
]
quant = [
    "bitsandbytes>=0.44",
]
tracking = [
    "wandb==0.29.0",
    "tensorboard==2.21.0",
]
dev = [
    "pytest==9.1.1",
    "ruff",
    "black",
]


[project.urls]
Homepage = "https://github.com/microsoft/thinkingbox-training"
Repository = "https://github.com/microsoft/thinkingbox-training"
Paper = "https://arxiv.org/abs/2608.19741"
Documentation = "https://github.com/microsoft/thinkingbox-training/tree/v0.1.0/docs"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
thinkingbox = { git = "https://github.com/microsoft/thinkingbox.git", rev = "892964e7226044e5463ad188da119df838f4bec1" }

[tool.uv.extra-build-dependencies]
flash-attn = ["torch==2.13.0", "packaging", "ninja"]
causal-conv1d = ["torch==2.13.0", "numpy==2.3.5", "packaging", "wheel"]

[tool.setuptools.packages.find]
where = ["."]
include = ["trainer*"]

[tool.setuptools]
py-modules = ["sitecustomize"]
