[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkingbox-training"
version = "0.1.0"
description = "Fine-tuning / RL training scripts built on top of the thinkingbox framework"
requires-python = ">=3.12,<3.13"
dependencies = [
    "thinkingbox",
    "torch==2.11.0",
    "transformers==5.14.1",
    "accelerate==1.14.0",
    "peft==0.19.1",
    "numpy==1.26.4",
    "safetensors==0.8.0",
    "einops==0.8.2",
    "flash-linear-attention==0.5.1",
    "requests==2.34.2",
    "pyyaml==6.0.3",
    "triton==3.6.0",
    "verl==0.8.0",
    "vllm==0.26.0",
]

[project.optional-dependencies]
fast = [
    "flash-attn==2.8.3",
]
tracking = [
    "wandb==0.29.0",
    "tensorboard==2.21.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff",
    "black",
]

[tool.uv.sources]
# Use the sibling thinkingbox checkout as an editable install.
thinkingbox = { path = "../thinkingbox", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["train", "train.*"]
exclude = ["train.tests", "train.tests.*"]
